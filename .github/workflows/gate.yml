# Spike S4 central gate: exchanges the job's OIDC token with octo-sts and posts
# a check run as the broker's App. No third-party actions, no PR code executed.
name: gate

on:
  workflow_call: {}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Exchange OIDC token and post check
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${PR_HEAD_SHA:-$RUN_HEAD_SHA}"
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=octo-sts.dev" | jq -r .value)
          echo "::add-mask::$oidc"
          echo "OIDC claims (not secret):"
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ["repository","repository_owner","ref","event_name","job_workflow_ref","workflow_ref","environment","sub"]},indent=2))' "$oidc"
          resp=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $oidc" \
            "https://octo-sts.dev/sts/exchange?scope=$REPO&identity=riskinator")
          code=$(tail -n1 <<<"$resp"); body=$(sed '$d' <<<"$resp")
          echo "exchange status: $code"
          if [ "$code" != "200" ]; then echo "$body"; exit 1; fi
          token=$(jq -r .token <<<"$body")
          echo "::add-mask::$token"
          payload=$(jq -n --arg sha "$sha" --arg ev "$EVENT" \
            '{name:"riskinator", head_sha:$sha, status:"completed", conclusion:"neutral",
              output:{title:"S4 spike", summary:("Posted with an octo-sts token. Event: " + $ev)}}')
          curl -fsS -X POST -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/check-runs" -d "$payload" | jq '{id, name, app: .app.slug, head_sha}'
          curl -fsS -X DELETE -H "Authorization: Bearer $token" https://api.github.com/installation/token || true
